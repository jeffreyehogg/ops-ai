name: OpsAI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore OpsAI.sln

    - name: Build Solution
      run: dotnet build OpsAI.sln -c Release --no-restore

    - name: Run Test Suite
      run: dotnet test OpsAI.sln -c Release --no-build --verbosity normal
